<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #fff;
    }

    .site-header {
      background-color: #f8f9fa;
      border-bottom: 1px solid #e9ecef;
      padding: 1rem 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .site-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #212529;
      text-decoration: none;
    }

    .site-title:hover {
      color: #0056b3;
    }

    .site-nav {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-link {
      text-decoration: none;
      color: #495057;
      font-size: 1rem;
      transition: color 0.3s ease;
    }

    .nav-link:hover {
      color: #0056b3;
    }

    .menu-toggle {
      display: none;
      flex-direction: column;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.5rem;
    }

    .menu-toggle span {
      width: 25px;
      height: 3px;
      background-color: #212529;
      margin: 5px 0;
      transition: 0.3s;
      border-radius: 3px;
    }

    main {
      max-width: 900px;
      margin: 3rem auto;
      padding: 0 1rem;
      min-height: calc(100vh - 300px);
    }

    main h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #212529;
    }

    main h2 {
      font-size: 1.8rem;
      margin-top: 2rem;
      margin-bottom: 1rem;
      color: #212529;
    }

    main h3 {
      font-size: 1.3rem;
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
      color: #212529;
    }

    main p {
      margin-bottom: 1rem;
      color: #495057;
    }

    main ul, main ol {
      margin-left: 2rem;
      margin-bottom: 1rem;
    }

    main a {
      color: #0056b3;
      text-decoration: none;
    }

    main a:hover {
      text-decoration: underline;
    }

    .site-footer {
      background-color: #f8f9fa;
      border-top: 1px solid #e9ecef;
      text-align: center;
      padding: 2rem 1rem;
      margin-top: 3rem;
      color: #6c757d;
      font-size: 0.9rem;
    }

    /* Responsive Design - Tablet (max 768px) */
    @media (max-width: 768px) {
      .wrapper {
        flex-wrap: wrap;
      }

      .menu-toggle {
        display: flex;
      }

      .site-nav {
        display: none;
        flex-direction: column;
        position: absolute;
        top: 60px;
        left: 0;
        right: 0;
        background-color: #f8f9fa;
        border-bottom: 1px solid #e9ecef;
        gap: 0;
        padding: 1rem;
        width: 100%;
      }

      .site-nav.active {
        display: flex;
      }

      .nav-link {
        padding: 0.75rem 0;
        border-bottom: 1px solid #e9ecef;
      }

      .nav-link:last-child {
        border-bottom: none;
      }

      main h1 {
        font-size: 2rem;
      }

      main h2 {
        font-size: 1.5rem;
      }

      main {
        margin-top: 2rem;
      }
    }

    /* Responsive Design - Mobile (max 480px) */
    @media (max-width: 480px) {
      .site-title {
        font-size: 1.25rem;
      }

      main h1 {
        font-size: 1.5rem;
      }

      main h2 {
        font-size: 1.2rem;
      }

      main {
        margin-top: 1.5rem;
        padding: 0 0.75rem;
      }
    }
  </style>
</head>
<body>
  {% include header.html %}

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}. All rights reserved.</p>
  </footer>
</body>
</html>
