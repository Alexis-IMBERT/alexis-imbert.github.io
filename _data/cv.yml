    Projects:
      - name: INSA Certified Project
        date: 2023
        summary: Project in collaboration with Actémium Paris Transport. Object detection in images and videos within the compressed domain, applied to road surveillance videos in tunnels.

      - name: Web Platform for Academic Mobility Support
        date: 2023
        summary: Design of a web platform to facilitate administrative procedures for academic mobility from the perspectives of students and faculty.

      - name: Fermi and von Neumann Elephant
        date: 2022
        summary: Project illustrating Von Neumann’s elephant concept, with functionalities for generating new designs, computing Fourier series, and reproducing initial designs with adjustable parameters.

      - name: '"Pixel War" Multiplayer Game'
        date: 2022
        summary: Recreation of the "Pixel War" multiplayer game in a team of three, including backend, frontend, and database development. Players collaboratively place pixels on a canvas to create drawings.

      - name: Recognition of Visually Identical Images
        date: 2021
        summary: Application of mathematical methods to detect pairs of visually identical images, accounting for variations in size, noise, and transformations. Introduction to machine learning concepts.

      - name: Spellchecker in C
        date: 2021
        summary: Team project in C to develop a spellchecker using tree structures.

