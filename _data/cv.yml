    Experience:
      - company: INSA Rouen Normandie
        position: PhD Student, Sulcal Pit Analysis of Cortical Surfaces with GNN
        location: Rouen, France
        start_date: 2024
        end_date: 2027
        summary: >-
          Thesis supervised by Paul Honeine (University of Rouen), Guillaume Auzias (Institut
          de Neurosciences de la Timone, CNRS, Aix-Marseille University), and Benoît Gaüzère
          (INSA Rouen Normandie). Funded by the French National Research Agency as part of
          the FAMOUS project.
        highlights:
          - "**Hierarchical Information Analysis in Brain Graphs:** How can graph machine learning models effectively capture and utilize hierarchical information in brain graphs to enhance the representation and analysis of cortical folding patterns?"
          - "**Robustness to MRI Acquisition Variations:** Can a graph machine learning model trained on brain data from one acquisition center generalize effectively to data from different centers, improving reproducibility in neuroimaging studies? This research explores transfer learning applications in GML."
          - "**Local Variation Identification for Cognitive Functions:** How can GML methods identify and analyze local variations in brain anatomy, and what insights can these variations provide regarding cognitive functions and neurological conditions?"
          - "Publication at GBR 2025."

      - company: Teklia
        position: Research Engineer Internship, Historical Image Description with LLM
        location: Paris, France
        start_date: "2024-02"
        end_date: "2024-10"
        summary: Automatic description of historical Japanese photography using large multimodal language models (LLM). Project in collaboration with the Guimet Museum of Asian Arts and Teklia.
        highlights:
          - Benchmarking of prompt engineering software
          - Image processing for consistency
          - Large-scale experiment deployment
          - Fine-tuning of existing models with project images
          - Poster presentation at SIFED 2024

