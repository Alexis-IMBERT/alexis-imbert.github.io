    # Experience:
      - company: INSA Rouen Normandie
        position: PhD Student in Computer Science
        location: Rouen, France
        start_date: 2024
        end_date: Present
        summary: >-
          Thesis supervised by Paul Honeine (University of Rouen), Guillaume Auzias (Institut
          de Neurosciences de la Timone, CNRS, Aix-Marseille University), and Benoˆıt Ga¨uz`ere
          (INSA Rouen Normandie). Funded by the French National Research Agency as part of
          the FAMOUS project. Research Questions:
          1. Hierarchical Information Analysis in Brain Graphs: How can graph machine learning
          models effectively capture and utilize hierarchical information in brain graphs to
          enhance the representation and analysis of cortical folding patterns?
          2. Robustness to MRI Acquisition Variations: Can a graph machine learning model
          trained on brain data from one acquisition center generalize effectively to data from
          different centers, improving reproducibility in neuroimaging studies? This research
          explores transfer learning applications in GML.
          3. Local Variation Identification for Cognitive Functions: How can GML methods identify
          and analyze local variations in brain anatomy, and what insights can these variations
          provide regarding cognitive functions and neurological conditions?
