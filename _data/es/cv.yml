    Experiencia:
      - company: INSA Rouen Normandie
        position: Doctorando, análisis de los pits sulcales de la superficie cortical con GNN
        location: Ruan, Francia
        start_date: 2024
        end_date: 2027
        summary: >-
          Tesis dirigida por Paul Honeine (Universidad de Ruan), Guillaume Auzias (Institut
          de Neurosciences de la Timone, CNRS, Universidad de Aix-Marsella) y Benoît Gaüzère
          (INSA Rouen Normandie). Financiada por la Agencia Nacional de Investigación francesa
          (ANR) en el marco del proyecto FAMOUS.
        highlights:
          - "**Análisis de la información jerárquica en grafos cerebrales:** ¿cómo pueden los modelos de aprendizaje automático sobre grafos captar y aprovechar la información jerárquica de los grafos cerebrales para representar y analizar mejor los patrones de plegamiento cortical?"
          - "**Robustez frente a las variaciones de adquisición de RM:** ¿puede un modelo de aprendizaje sobre grafos entrenado con datos de un centro de adquisición generalizar a otros centros y mejorar la reproducibilidad de los estudios de neuroimagen? Esta investigación explora el aprendizaje por transferencia en GML."
          - "**Identificación de variaciones locales asociadas a funciones cognitivas:** ¿cómo pueden los métodos de GML identificar y analizar las variaciones locales de la anatomía cerebral, y qué revelan sobre las funciones cognitivas y las enfermedades neurológicas?"
          - "Publicación en GBR 2025."

      - company: Teklia
        position: Prácticas de ingeniero de investigación, descripción de imágenes históricas con LLM
        location: París, Francia
        start_date: "2024-02"
        end_date: "2024-10"
        summary: Descripción automática de fotografías japonesas históricas mediante grandes modelos de lenguaje multimodales (LLM). Proyecto en colaboración con el Museo Guimet de Artes Asiáticas y Teklia.
        highlights:
          - Evaluación comparativa de herramientas de prompt engineering
          - Procesamiento de imágenes para homogeneizar el corpus
          - Despliegue de experimentos a gran escala
          - Ajuste fino (fine-tuning) de modelos existentes con las imágenes del proyecto
          - Presentación de un póster en SIFED 2024

