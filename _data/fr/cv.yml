      - company: INSA Rouen Normandie
        position: Doctorant, analyse des pits sulcaux des surfaces corticales par GNN
        location: Rouen, France
        start_date: 2024
        end_date: 2027
        summary: >-
          Thèse encadrée par Paul Honeine (Université de Rouen), Guillaume Auzias (Institut
          de Neurosciences de la Timone, CNRS, Aix-Marseille Université) et Benoît Gaüzère
          (INSA Rouen Normandie). Financée par l'Agence nationale de la recherche dans le
          cadre du projet FAMOUS.
        highlights:
          - "**Analyse de l'information hiérarchique dans les graphes cérébraux :** comment les modèles d'apprentissage automatique sur graphes peuvent-ils capturer et exploiter l'information hiérarchique des graphes cérébraux pour mieux représenter et analyser les motifs de plissement cortical ?"
          - "**Robustesse aux variations d'acquisition IRM :** un modèle d'apprentissage sur graphes entraîné sur des données d'un centre d'acquisition peut-il se généraliser à d'autres centres et améliorer la reproductibilité des études en neuroimagerie ? Ces travaux explorent l'apprentissage par transfert en GML."
          - "**Identification des variations locales liées aux fonctions cognitives :** comment les méthodes de GML peuvent-elles identifier et analyser les variations locales de l'anatomie cérébrale, et qu'apprennent-elles sur les fonctions cognitives et les pathologies neurologiques ?"
          - "Publication à GBR 2025."

      - company: Teklia
        position: Stage ingénieur de recherche, description d'images historiques par LLM
        location: Paris, France
        start_date: "2024-02"
        end_date: "2024-10"
        summary: Description automatique de photographies japonaises historiques à l'aide de grands modèles de langage multimodaux (LLM). Projet mené en collaboration avec le Musée national des arts asiatiques – Guimet et Teklia.
        highlights:
          - Comparaison d'outils de prompt engineering
          - Traitement d'images pour homogénéiser le corpus
          - Déploiement d'expériences à grande échelle
          - Fine-tuning de modèles existants sur les images du projet
          - Présentation d'un poster à SIFED 2024

